# Knowledge Base 中间件一键启动
# 用法：在 D:\knowledge_base 目录下执行
#   docker compose up -d        # 启动
#   docker compose down         # 停止（保留数据卷）
#   docker compose down -v      # 停止并删除数据卷（清空数据）
#
# 端口映射（与项目 .env / .env.example 默认值保持一致）：
#   Milvus   19530   (standalone，存储向量)
#   MinIO    9000 / 9001 (9001 为控制台)
#   MongoDB  27017
#   Attu     13000   (Milvus 可视化管理，可选)
#
# 默认账号：MinIO  minioadmin / minioadmin
# 自动创建的桶：knowledge-base（项目上传文件用，已在 create-buckets 中初始化）
# 注意：MongoDB 未开启鉴权，以匹配 .env 中 mongodb://localhost:27017 的连接串。
#       若你的 .env 修改过端口/账号/桶名，请同步修改本文件。

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: minio server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 10

  # 应用所需桶 knowledge-base 的一次性初始化
  # 注：不用单独的 minio/mc 镜像（国内加速器对其 403），改用 minio 镜像自带的 mc
  create-buckets:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/knowledge-base;
      exit 0;
      "

  milvus:
    image: milvusdb/milvus:v2.5.27
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 10

  mongo:
    image: mongo:7.0
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 30s
      timeout: 10s
      retries: 5

  # 可选：Milvus 可视化管理界面（浏览器打开 http://localhost:13000）
  attu:
    image: zilliz/attu:latest
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "13000:3000"
    depends_on:
      - milvus

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  mongo_data:
