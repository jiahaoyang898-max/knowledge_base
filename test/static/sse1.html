<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>场景1：基础SSE</title>
</head>
<body>
    <h3>场景1：基础SSE</h3>
    <div id="result"></div>

    <script>
        // ✅ 核心：创建EventSource连接SSE接口
        const eventSource = new EventSource("http://127.0.0.1:8001/simple_stream");
        // 作用：根据标签的 id 属性，查找页面元素。
        const resultDom = document.getElementById("result");

        // 监听SSE消息（实时接收）
// eventSource：你前面 new EventSource() 创建的 SSE 长连接对象
// onmessage：消息监听事件
// 作用：后端每推送一条 SSE 消息，浏览器就自动执行这个函数
//         回调函数，event 是浏览器自动传入的消息事件对象
        eventSource.onmessage = function(event) {
            if (event.data === "[END]") {
                eventSource.close();
                return;
            }
            resultDom.innerHTML += event.data + "<br>";
        };
    </script>
</body>
</html>
