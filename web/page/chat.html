<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>BOSS智库知识库</title>
  <style>
    :root{
      --bg:#eef2f8;
      --panel:#ffffff;
      --text:#1a2332;
      --muted:#6b7a90;
      --brand:#4f6ef7;
      --brand2:#8b5cf6;
      --brand-soft:rgba(79,110,247,.08);
      --bubble-user:linear-gradient(135deg,#4f6ef7,#7c3aed);
      --bubble-bot:#ffffff;
      --border:#e3e8f0;
      --border-hover:#c5cee0;
      --success:#10b981;
      --warning:#f59e0b;
      --error:#ef4444;
      --shadow-sm:0 2px 8px rgba(31,45,61,.06);
      --shadow:0 8px 24px rgba(31,45,61,.08);
      --shadow-lg:0 20px 48px rgba(31,45,61,.12);
      --radius:16px;
      --radius-sm:10px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:"SF Pro Display","Segoe UI","Microsoft YaHei",system-ui,-apple-system,Arial,sans-serif;
      background:
        radial-gradient(900px 500px at 15% -5%,rgba(79,110,247,.14),transparent 60%),
        radial-gradient(800px 400px at 90% 5%,rgba(139,92,246,.12),transparent 55%),
        radial-gradient(600px 600px at 50% 110%,rgba(79,110,247,.06),transparent 60%),
        var(--bg);
      color:var(--text);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:16px;
      -webkit-font-smoothing:antialiased;
    }

    /* ========== App Container ========== */
    .app{
      width:100%;
      max-width:1000px;
      height:min(840px,94vh);
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow-lg);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      position:relative;
    }

    /* ========== Top Bar ========== */
    .topbar{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px 20px;
      border-bottom:1px solid var(--border);
      background:rgba(255,255,255,.72);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      z-index:10;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:240px;
    }
    .logo{
      width:40px;height:40px;
      border-radius:12px;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      box-shadow:0 6px 16px rgba(79,110,247,.3);
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;
      position:relative;
      overflow:hidden;
    }
    .logo::after{
      content:'';
      position:absolute;inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,.25),transparent 50%);
    }
    .logo svg{position:relative;z-index:1}
    .title{display:flex;flex-direction:column;line-height:1.2}
    .title strong{font-size:15px;font-weight:700;letter-spacing:-.2px}
    .title span{font-size:11.5px;color:var(--muted);margin-top:2px}

    .top-actions{
      margin-left:auto;
      display:flex;gap:10px;align-items:center;
    }
    .top-actions label{
      font-size:12px;display:flex;align-items:center;gap:5px;
      cursor:pointer;user-select:none;color:var(--muted);
      transition:color .2s;
    }
    .top-actions label:hover{color:var(--text)}
    .top-actions input[type="checkbox"]{
      width:15px;height:15px;accent-color:var(--brand);cursor:pointer;
    }
    .pill{
      font-size:11.5px;font-weight:500;
      color:var(--muted);
      border:1px solid var(--border);
      padding:5px 12px;
      border-radius:999px;
      background:#fff;
      display:flex;align-items:center;gap:6px;
      transition:all .25s;
    }
    .pill::before{
      content:'';width:7px;height:7px;border-radius:50%;
      background:var(--error);
      transition:background .3s;
    }
    .pill.connected{color:var(--success);border-color:rgba(16,185,129,.25)}
    .pill.connected::before{background:var(--success);box-shadow:0 0 6px rgba(16,185,129,.5)}

    .btn-ghost{
      border:1px solid var(--border);
      background:#fff;
      color:var(--muted);
      padding:6px 14px;
      border-radius:8px;
      font-size:12px;
      cursor:pointer;
      transition:all .2s;
      font-weight:500;
    }
    .btn-ghost:hover{border-color:var(--border-hover);color:var(--text);background:#f8fafc}

    /* ========== Chat Area ========== */
    .chat{
      flex:1;
      overflow:auto;
      padding:20px 18px 8px;
      background:
        radial-gradient(circle at 1px 1px,rgba(79,110,247,.04) 1px,transparent 0);
        background-size:24px 24px;
    }
    .dayline{
      text-align:center;
      color:var(--muted);
      font-size:11.5px;
      margin:4px 0 18px;
      letter-spacing:.5px;
    }
    .dayline::before,.dayline::after{
      content:'';
      display:inline-block;
      width:30px;height:1px;
      background:var(--border);
      vertical-align:middle;
      margin:0 10px;
    }

    /* ========== Messages ========== */
    .msg{
      display:flex;
      gap:10px;
      margin:12px 0;
      align-items:flex-end;
      animation:msgIn .35s cubic-bezier(.16,1,.3,1);
    }
    @keyframes msgIn{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }
    .msg.user{justify-content:flex-end}
    .msg > div:not(.avatar){
      flex:1;min-width:0;
    }
    .msg.user > div:not(.avatar){
      display:flex;flex-direction:column;align-items:flex-end;
    }

    .avatar{
      width:36px;height:36px;
      border-radius:11px;
      display:flex;align-items:center;justify-content:center;
      font-size:13px;font-weight:600;
      flex:0 0 auto;
      flex-shrink:0;
    }
    .avatar.bot{
      background:linear-gradient(135deg,rgba(79,110,247,.12),rgba(139,92,246,.12));
      color:var(--brand);
      border:1px solid rgba(79,110,247,.15);
    }
    .avatar.user{
      background:linear-gradient(135deg,#f0f4ff,#f5f0ff);
      color:var(--muted);
      border:1px solid var(--border);
    }

    .bubble{
      max-width:min(720px,76%);
      display:inline-block;
      border-radius:14px;
      padding:11px 14px;
      border:1px solid var(--border);
      background:var(--bubble-bot);
      line-height:1.6;
      font-size:14px;
      white-space:pre-wrap;
      overflow-wrap:break-word;
      box-shadow:var(--shadow-sm);
    }
    .msg.user .bubble{
      background:var(--bubble-user);
      color:#fff;
      border-color:transparent;
      box-shadow:0 4px 14px rgba(79,110,247,.25);
    }
    .meta{
      font-size:10.5px;
      color:var(--muted);
      margin-top:5px;
      padding:0 2px;
    }
    .msg.user .meta{color:rgba(255,255,255,.7)}

    /* ========== Progress Card ========== */
    .progress-card{
      margin-top:10px;
      border:1px solid var(--border);
      border-radius:12px;
      overflow:hidden;
      background:linear-gradient(180deg,#fafbfd,#f5f7fb);
    }
    .progress-card summary{
      cursor:pointer;
      user-select:none;
      padding:9px 12px;
      display:flex;
      align-items:center;
      gap:8px;
      list-style:none;
      font-size:12px;
      color:var(--muted);
      transition:background .2s;
    }
    .progress-card summary::-webkit-details-marker{display:none}
    .progress-card summary:hover{background:rgba(79,110,247,.04)}
    .progress-icon{
      width:16px;height:16px;
      border-radius:50%;
      border:2px solid rgba(79,110,247,.2);
      border-top-color:var(--brand);
      animation:spin .7s linear infinite;
      flex-shrink:0;
    }
    .progress-card.done .progress-icon{
      animation:none;
      border:none;
      background:var(--success);
      position:relative;
    }
    .progress-card.done .progress-icon::after{
      content:'';
      position:absolute;
      left:4px;top:1px;
      width:4px;height:8px;
      border:solid #fff;
      border-width:0 2px 2px 0;
      transform:rotate(45deg);
    }
    .progress-card.failed .progress-icon{
      animation:none;
      border:none;
      background:var(--error);
      position:relative;
    }
    .progress-card.failed .progress-icon::after{
      content:'x';color:#fff;font-size:10px;font-weight:700;
      line-height:16px;text-align:center;
      position:absolute;inset:0;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .progress-label{font-weight:500;flex:1}
    .progress-badge{
      font-size:10.5px;
      font-weight:600;
      padding:2px 8px;
      border-radius:999px;
      letter-spacing:.3px;
    }
    .progress-badge.pending{background:#f0f1f5;color:var(--muted)}
    .progress-badge.processing{background:rgba(79,110,247,.12);color:var(--brand)}
    .progress-badge.completed{background:rgba(16,185,129,.12);color:var(--success)}
    .progress-badge.failed{background:rgba(239,68,68,.12);color:var(--error)}

    .progress-list{
      padding:4px 12px 10px;
    }
    .progress-item{
      display:flex;
      align-items:flex-start;
      gap:7px;
      padding:4px 0;
      font-size:12px;
      color:#4a5a6e;
      animation:stepIn .3s ease;
    }
    @keyframes stepIn{
      from{opacity:0;transform:translateX(-6px)}
      to{opacity:1;transform:translateX(0)}
    }
    .progress-item .step-mark{
      flex-shrink:0;
      width:16px;height:16px;
      border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:10px;
      margin-top:1px;
    }
    .progress-item.done .step-mark{
      background:var(--success);
      color:#fff;
    }
    .progress-item.done .step-mark::after{
      content:'';
      width:4px;height:7px;
      border:solid #fff;
      border-width:0 1.5px 1.5px 0;
      transform:rotate(45deg) translate(-1px,-1px);
    }
    .progress-item.running .step-mark{
      border:2px solid rgba(79,110,247,.25);
      border-top-color:var(--brand);
      animation:spin .7s linear infinite;
    }
    .progress-item.failed .step-mark{
      background:var(--error);
      color:#fff;
    }
    .progress-item.failed .step-mark::after{
      content:'×';
      font-size:12px;
      font-weight:700;
      line-height:16px;
    }
    .progress-item.muted{color:var(--muted);opacity:.6}
    .progress-item.muted .step-mark{background:#dde2ec}

    /* ========== Answer Images ========== */
    .answer-text{word-break:break-word}
    .answer-images{
      margin-top:10px;
      display:flex;flex-direction:column;gap:10px;
    }
    .answer-images img{
      display:block;
      max-width:min(100%,600px);
      max-height:600px;
      border-radius:10px;
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      background:#fff;
    }
    .answer-images a{
      font-size:11.5px;color:var(--muted);
      text-decoration:none;word-break:break-all;
    }
    .answer-images a:hover{color:var(--brand)}

    /* ========== Typing Indicator ========== */
    .typing{
      display:inline-flex;gap:5px;align-items:center;
      padding:2px 0;
    }
    .typing .dot{
      width:7px;height:7px;border-radius:50%;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      animation:typingBounce 1.3s infinite ease-in-out;
    }
    .typing .dot:nth-child(2){animation-delay:.15s}
    .typing .dot:nth-child(3){animation-delay:.3s}
    @keyframes typingBounce{
      0%,70%,100%{transform:translateY(0) scale(.85);opacity:.5}
      35%{transform:translateY(-6px) scale(1);opacity:1}
    }

    /* ========== Composer ========== */
    .composer-wrap{
      border-top:1px solid var(--border);
      background:rgba(255,255,255,.72);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
      padding:12px 16px 10px;
    }
    .composer{
      display:flex;gap:10px;align-items:flex-end;
    }
    textarea{
      flex:1;
      resize:none;
      min-height:44px;max-height:140px;
      padding:11px 14px;
      border-radius:12px;
      border:1.5px solid var(--border);
      outline:none;
      font-size:14px;
      line-height:1.5;
      font-family:inherit;
      background:#fff;
      transition:border-color .2s,box-shadow .2s;
    }
    textarea::placeholder{color:#aab4c4}
    textarea:focus{
      border-color:var(--brand);
      box-shadow:0 0 0 3px rgba(79,110,247,.1);
    }
    .send{
      width:92px;height:44px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-size:14px;font-weight:600;
      color:#fff;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      box-shadow:0 4px 14px rgba(79,110,247,.3);
      transition:all .2s;
      display:flex;align-items:center;justify-content:center;gap:6px;
    }
    .send:hover:not(:disabled){
      transform:translateY(-1px);
      box-shadow:0 6px 20px rgba(79,110,247,.4);
    }
    .send:active:not(:disabled){transform:translateY(0)}
    .send:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
    .hint{
      margin-top:8px;
      color:var(--muted);
      font-size:11.5px;
      text-align:center;
    }
    .kbd{
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
      border:1px solid var(--border);
      padding:1px 5px;
      border-radius:5px;
      background:#f7f9fc;
      color:#4a5a6e;
      font-size:11px;
    }

    /* ========== Scrollbar ========== */
    .chat::-webkit-scrollbar{width:6px}
    .chat::-webkit-scrollbar-track{background:transparent}
    .chat::-webkit-scrollbar-thumb{
      background:rgba(107,122,144,.2);
      border-radius:3px;
    }
    .chat::-webkit-scrollbar-thumb:hover{background:rgba(107,122,144,.35)}
    textarea::-webkit-scrollbar{width:5px}
    textarea::-webkit-scrollbar-thumb{background:rgba(107,122,144,.2);border-radius:3px}

    /* ========== Responsive ========== */
    @media(max-width:640px){
      body{padding:0}
      .app{border-radius:0;height:100vh;max-width:100%}
      .top-actions label{display:none}
      .bubble{max-width:85%}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L3 7v6c0 5 3.8 9.7 9 11 5.2-1.3 9-6 9-11V7l-9-5z" fill="rgba(255,255,255,.95)"/>
            <path d="M9 12l2 2 4-4" stroke="#4f6ef7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
        <div class="title">
          <strong>BOSS智库知识库</strong>
          <span id="subTitle">在线 · 可查询知识库与联网信息</span>
        </div>
      </div>
      <div class="top-actions">
        <label>
          <input type="checkbox" id="streamToggle" checked> 流式输出
        </label>
        <span class="pill" id="apiPill">API 未连接</span>
        <button class="btn-ghost" id="btnClear">清空对话</button>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="dayline">今天</div>
      <div class="msg bot">
        <div class="avatar bot">B</div>
        <div>
          <div class="bubble">你好，我是BOSS智库知识库客服。你可以直接提问，我会在"阶段进度"里展示处理过程。</div>
          <div class="meta">提示：可以问"如何使用万用表测量电压？"</div>
        </div>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" placeholder="请输入问题（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="send" id="send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
          发送
        </button>
      </div>
      <div class="hint">快捷键：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行</div>
    </div>
  </div>

  <script>
    /* ========== Constants ========== */
    // 固定指向本机后端服务(8001)。若后端部署到其它主机/端口,只需改这一行的地址。
    const API_BASE = 'http://127.0.0.1:8001';

    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const apiPill = document.getElementById('apiPill');
    const btnClear = document.getElementById('btnClear');
    const streamToggle = document.getElementById('streamToggle');

    /* ========== Session ========== */
    let sessionId = localStorage.getItem('kb_session_id');
    if (!sessionId) {
      sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('kb_session_id', sessionId);
    }

    /* ========== Stream Lifecycle Management (BUG FIX) ========== */
    // 全局引用：确保每次新对话前关闭上一次的 EventSource，防止自动重连导致进度串台
    let currentEventSource = null;
    let currentStreamDone = false;

    function closeCurrentStream() {
      if (currentEventSource) {
        currentEventSource.close();
        currentEventSource = null;
      }
      currentStreamDone = false;
    }

    /* ========== Utilities ========== */
    function scrollToBottom() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }
    function nowTime() {
      return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }
    function formatTime(ts) {
      if (!ts) return nowTime();
      const d = new Date(Number(ts) * 1000);
      if (Number.isNaN(d.getTime())) return nowTime();
      return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }
    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }
    function isImageUrl(url) {
      try {
        const u = new URL(url);
        return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
      } catch (e) {
        return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
      }
    }
    function normalizeUrl(rawUrl) {
      return String(rawUrl || '').trim().replace(/\s/g, '%20');
    }
    function dedupeKeepOrder(arr) {
      const seen = new Set();
      const out = [];
      for (const x of (Array.isArray(arr) ? arr : [])) {
        const v = String(x || '');
        if (!v || seen.has(v)) continue;
        seen.add(v);
        out.push(v);
      }
      return out;
    }
    function extractUrlsLoose(text) {
      const matches = String(text || '').match(/(https?:\/\/[^\s]+)/g) || [];
      const trimTail = (u) => String(u || '').replace(/[)\]}'">,.;:；。，、]+$/g, '');
      const trimHead = (u) => String(u || '').replace(/^[<([{'"]+/g, '');
      return dedupeKeepOrder(matches.map(m => trimHead(trimTail(m))));
    }
    function findLastImageMarkerIndex(raw) {
      const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
      let m, lastIdx = -1, lastLen = 0;
      while ((m = re.exec(String(raw || ''))) !== null) {
        lastIdx = m.index;
        lastLen = m[0].length;
      }
      return { idx: lastIdx, len: lastLen };
    }
    function parseAnswerAndImages(text) {
      const raw = String(text || '');
      const { idx, len } = findLastImageMarkerIndex(raw);
      if (idx === -1) return { text: raw, images: [] };
      const before = raw.slice(0, idx).trimEnd();
      const after = raw.slice(idx + len).trim();
      const urls = [];
      const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      for (const line of lines) {
        if (line.startsWith('http://') || line.startsWith('https://')) {
          urls.push(line);
        } else {
          urls.push(...extractUrlsLoose(line));
        }
      }
      const seen = new Set();
      const images = [];
      for (const u of urls) {
        const n = normalizeUrl(u);
        if (!isImageUrl(n) || seen.has(n)) continue;
        seen.add(n);
        images.push(n);
      }
      return { text: before, images };
    }

    /* ========== Render Helpers ========== */
    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls) {
      const { text, images: imagesFromBlock } = parseAnswerAndImages(answerText);
      const candidates = Array.isArray(candidateImageUrls)
        ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl)
        : [];
      const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);
      const allImages = Array.from(new Set([
        ...(imagesFromBlock || []),
        ...candidates,
        ...looseImages
      ]));

      containerEl.textContent = '';

      const textEl = document.createElement('div');
      textEl.className = 'answer-text';
      textEl.textContent = (text || '').trim().length > 0 ? text : '（已完成，但未返回答案）';
      containerEl.appendChild(textEl);

      if (allImages.length > 0) {
        const imgWrap = document.createElement('div');
        imgWrap.className = 'answer-images';
        for (const url of allImages) {
          const safeUrl = normalizeUrl(url);
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.src = safeUrl;
          img.alt = '参考图片';
          img.referrerPolicy = 'no-referrer';
          img.addEventListener('error', () => { img.style.display = 'none'; });
          imgWrap.appendChild(img);

          const link = document.createElement('a');
          link.href = safeUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = url;
          imgWrap.appendChild(link);
        }
        containerEl.appendChild(imgWrap);
      }
    }

    function addUserMsg(text) {
      chatEl.insertAdjacentHTML('beforeend', `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${nowTime()}</div>
          </div>
          <div class="avatar user">我</div>
        </div>`);
      scrollToBottom();
    }

    function addUserMsgWithTime(text, ts) {
      chatEl.insertAdjacentHTML('beforeend', `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
          <div class="avatar user">我</div>
        </div>`);
      scrollToBottom();
    }

    function addBotMsgWithTime(text, ts, imageUrls) {
      const id = 'bot-his-' + Math.random().toString(36).slice(2);
      chatEl.insertAdjacentHTML('beforeend', `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">B</div>
          <div>
            <div class="bubble"><div class="answer"></div></div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
        </div>`);
      const el = document.getElementById(id);
      if (el) {
        renderAnswerWithImages(el.querySelector('.answer'), text || '', imageUrls || []);
      }
      scrollToBottom();
    }

    function addBotMsgSkeleton() {
      const id = 'bot-' + Math.random().toString(36).slice(2);
      chatEl.insertAdjacentHTML('beforeend', `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">B</div>
          <div style="min-width:200px;">
            <div class="bubble">
              <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
              <details class="progress-card" open>
                <summary>
                  <span class="progress-icon"></span>
                  <span class="progress-label">正在思考...</span>
                  <span class="progress-badge pending">等待中</span>
                </summary>
                <div class="progress-list">
                  <div class="progress-item muted"><span class="step-mark"></span>暂无进度</div>
                </div>
              </details>
            </div>
            <div class="meta">${nowTime()}</div>
          </div>
        </div>`);
      scrollToBottom();
      return document.getElementById(id);
    }

    /* ========== Progress Rendering (BUG FIX: null-safe) ========== */
    function renderProgress(botMsgEl, doneList, runningList, status) {
      if (!botMsgEl) return;

      // 确保 progress-card 始终存在 —— 如果被移除过则重建
      let card = botMsgEl.querySelector('details.progress-card');
      if (!card) {
        card = document.createElement('details');
        card.className = 'progress-card';
        card.open = true;
        card.innerHTML = `
          <summary>
            <span class="progress-icon"></span>
            <span class="progress-label">阶段进度</span>
            <span class="progress-badge pending">等待中</span>
          </summary>
          <div class="progress-list"></div>`;
        const bubble = botMsgEl.querySelector('.bubble');
        if (bubble) bubble.appendChild(card);
      }

      let done = Array.isArray(doneList) ? doneList : [];
      let running = Array.isArray(runningList) ? runningList : [];

      // 生成完成时，将仍在进行中的步骤也标记为已完成
      if (status === 'completed') {
        done = done.concat(running);
        running = [];
      }

      const statusMap = {
        processing: '处理中',
        completed: '已完成',
        failed: '失败',
        pending: '等待中'
      };
      const displayStatus = statusMap[status] || status || 'unknown';

      // 更新卡片状态样式
      card.classList.remove('done', 'failed');
      if (status === 'completed') card.classList.add('done');
      if (status === 'failed') card.classList.add('failed');

      // 更新标签
      const labelEl = card.querySelector('.progress-label');
      if (labelEl) {
        labelEl.textContent = `阶段进度（已完成${done.length}，进行中${running.length}）`;
      }

      // 更新状态徽章
      const badgeEl = card.querySelector('.progress-badge');
      if (badgeEl) {
        badgeEl.textContent = displayStatus;
        badgeEl.className = 'progress-badge ' + (status || 'pending');
      }

      // 渲染步骤列表
      const listEl = card.querySelector('.progress-list');
      if (!listEl) return;
      listEl.innerHTML = '';

      const lines = [
        ...done.map(x => ({ type: 'done', text: x })),
        ...running.map(x => ({ type: 'running', text: x }))
      ];

      if (lines.length === 0) {
        listEl.innerHTML = '<div class="progress-item muted"><span class="step-mark"></span>暂无进度</div>';
        return;
      }

      for (const line of lines) {
        const item = document.createElement('div');
        item.className = 'progress-item ' + line.type;
        item.innerHTML = `<span class="step-mark"></span><span>${escapeHtml(line.text)}</span>`;
        listEl.appendChild(item);
      }
    }

    // 将当前进度卡片强制标记为最终状态（全部完成 / 失败），不会清空已有步骤
    function markProgressFinal(botMsgEl, isError) {
      if (!botMsgEl) return;
      const card = botMsgEl.querySelector('details.progress-card');
      if (!card) return;

      const items = Array.from(card.querySelectorAll('.progress-item'));
      let doneCount = 0;
      let runningCount = 0;

      for (const item of items) {
        if (item.classList.contains('running')) {
          item.classList.remove('running');
          item.classList.add(isError ? 'failed' : 'done');
        }
        if (item.classList.contains('done')) doneCount++;
        else if (item.classList.contains('running')) runningCount++;
      }

      const labelEl = card.querySelector('.progress-label');
      if (labelEl) {
        labelEl.textContent = `阶段进度（已完成${doneCount}，进行中${runningCount}）`;
      }

      const badgeEl = card.querySelector('.progress-badge');
      if (badgeEl) {
        badgeEl.textContent = isError ? '失败' : '已完成';
        badgeEl.className = 'progress-badge ' + (isError ? 'failed' : 'completed');
      }

      card.classList.remove('done', 'failed');
      card.classList.add(isError ? 'failed' : 'done');
      card.open = false;
    }

    function finalizeBotAnswer(botMsgEl, answer, error, imageUrls) {
      if (!botMsgEl) return;
      const bubble = botMsgEl.querySelector('.bubble');
      if (!bubble) return;

      const err = (error || '').trim();

      // 同步进度为最终状态：全部完成 / 失败
      markProgressFinal(botMsgEl, !!err);

      // 移除 typing 指示器
      const typing = botMsgEl.querySelector('.typing');
      if (typing) typing.remove();

      // 渲染答案
      let answerEl = bubble.querySelector('.answer');
      if (!answerEl) {
        answerEl = document.createElement('div');
        answerEl.className = 'answer';
        bubble.insertBefore(answerEl, bubble.firstChild);
      }

      if (err) {
        answerEl.textContent = `抱歉，本次处理失败：\n${err}`;
      } else {
        renderAnswerWithImages(answerEl, answer || '', imageUrls || []);
      }
    }

    /* ========== API ========== */
    async function apiHealth() {
      try {
        const res = await fetch(`${API_BASE}/health`);
        if (!res.ok) throw new Error();
        apiPill.textContent = 'API 已连接';
        apiPill.classList.add('connected');
      } catch (e) {
        apiPill.textContent = 'API 未连接';
        apiPill.classList.remove('connected');
      }
    }

    async function loadHistory() {
      try {
        const res = await fetch(`${API_BASE}/history/${sessionId}`);
        if (!res.ok) return;
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        if (items.length === 0) return;
        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for (let i = 1; i < nodes.length; i++) nodes[i].remove();
        for (const item of items) {
          if (item.role === 'user') {
            addUserMsgWithTime(item.text || '', item.ts);
          } else {
            addBotMsgWithTime(item.text || '', item.ts, item.image_urls || []);
          }
        }
        scrollToBottom();
      } catch (_) {}
    }

    async function submitQuery(text) {
      const isStream = streamToggle.checked;
      const res = await fetch(`${API_BASE}/query`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          query: text,
          session_id: sessionId,
          is_stream: isStream
        })
      });
      if (!res.ok) {
        const msg = await res.text();
        throw new Error(msg || '请求失败');
      }
      return await res.json();
    }

    async function poll(taskId, botMsgEl) {
      const typing = botMsgEl.querySelector('.typing');
      const interval = setInterval(async () => {
        try {
          const res = await fetch(`${API_BASE}/status/${taskId}`);
          const data = await res.json();
          renderProgress(botMsgEl, data.done_list, data.running_list, data.status);

          if (data.status === 'completed') {
            if (typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          } else if (data.status === 'failed') {
            if (typing) typing.remove();
            finalizeBotAnswer(botMsgEl, data.answer, data.error || 'failed', data.image_urls || []);
            clearInterval(interval);
            sendBtn.disabled = false;
          }
        } catch (e) { /* 轮询错误不终止 */ }
      }, 1200);
    }

    /* ========== Send Handler (BUG FIX: proper EventSource lifecycle) ========== */
    async function onSend() {
      const text = (inputEl.value || '').trim();
      if (!text) return;
      inputEl.value = '';

      // 关闭上一次的流式连接，防止自动重连导致进度串台
      closeCurrentStream();

      addUserMsg(text);
      const botMsgEl = addBotMsgSkeleton();
      sendBtn.disabled = true;

      try {
        const isStream = streamToggle.checked;
        const data = await submitQuery(text);

        renderProgress(botMsgEl, [], [], 'pending');

        if (!isStream) {
          // 非流式：直接拿结果
          renderProgress(botMsgEl, data.done_list || [], [], 'completed');
          finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
          sendBtn.disabled = false;
          return;
        }

        // 流式：SSE
        const { session_id } = data;

        const bubble = botMsgEl.querySelector('.bubble');
        let answerEl = bubble.querySelector('.answer');
        if (!answerEl) {
          answerEl = document.createElement('div');
          answerEl.className = 'answer';
          bubble.insertBefore(answerEl, bubble.firstChild);
        }

        // 创建新 EventSource 并保存全局引用
        const es = new EventSource(`${API_BASE}/stream/${session_id}`);
        currentEventSource = es;
        currentStreamDone = false;

        let rawAnswerText = '';

        es.addEventListener('progress', (e) => {
          try {
            const d = JSON.parse(e.data || '{}');
            renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
            if (d.status === 'completed') {
              const typing = botMsgEl.querySelector('.typing');
              if (typing) typing.remove();
              sendBtn.disabled = false;
            }
          } catch (_) {}
        });

        es.addEventListener('delta', (e) => {
          try {
            const d = JSON.parse(e.data || '{}');
            const delta = d.delta || '';
            if (delta) {
              rawAnswerText += delta;
              renderAnswerWithImages(answerEl, rawAnswerText, []);
              scrollToBottom();
            }
          } catch (_) {}
        });

        const handleFinal = (e) => {
          if (currentStreamDone) return;
          currentStreamDone = true;

          const typing = botMsgEl.querySelector('.typing');
          if (typing) typing.remove();

          // 最终完成：确保所有进行中步骤都标记为已完成
          markProgressFinal(botMsgEl, false);

          try {
            const d = JSON.parse(e.data || '{}');
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0)
              ? d.answer
              : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
          } catch (_) {}

          es.close();
          currentEventSource = null;
          sendBtn.disabled = false;
        };

        es.addEventListener('final', handleFinal);
        es.addEventListener('final_answer', handleFinal);

        es.addEventListener('error', (e) => {
          // 如果已经正常结束，忽略后续 error 事件
          if (currentStreamDone) return;
          currentStreamDone = true;

          const typing = botMsgEl.querySelector('.typing');
          if (typing) typing.remove();

          // 失败时同步进度状态
          markProgressFinal(botMsgEl, true);

          let errMsg = 'SSE 连接中断/失败';
          try {
            if (e && e.data) {
              const d = JSON.parse(e.data);
              if (d.error) errMsg = d.error;
            }
          } catch (_) {}

          rawAnswerText += `\n\n（错误：${errMsg}）`;
          renderAnswerWithImages(answerEl, rawAnswerText, []);

          // 关键：显式关闭，阻止 EventSource 自动重连
          es.close();
          currentEventSource = null;
          sendBtn.disabled = false;
        });

      } catch (e) {
        const bubble = botMsgEl.querySelector('.bubble');
        const typing = botMsgEl.querySelector('.typing');
        if (typing) typing.remove();

        const card = botMsgEl.querySelector('details.progress-card');
        if (card) { card.classList.add('failed'); card.open = false; }

        if (bubble) {
          let answerEl = bubble.querySelector('.answer');
          if (!answerEl) {
            answerEl = document.createElement('div');
            answerEl.className = 'answer';
            bubble.insertBefore(answerEl, bubble.firstChild);
          }
          answerEl.textContent = `请求失败：${e.message || e}`;
        }
        sendBtn.disabled = false;
      }
    }

    /* ========== Event Listeners ========== */
    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        onSend();
      }
    });

    btnClear.addEventListener('click', async () => {
      if (!confirm('确定要清空当前会话的历史记录吗？这将无法恢复。')) return;

      // 关闭当前流式连接
      closeCurrentStream();

      try {
        const res = await fetch(`${API_BASE}/history/${sessionId}`, { method: 'DELETE' });
        if (!res.ok) {
          console.error('Failed to clear history backend, status:', res.status);
          alert('服务端清空失败，仅清空本地显示');
        }
      } catch (e) {
        console.error('Failed to clear history backend', e);
        alert('服务端清空失败，仅清空本地显示');
      }

      const nodes = Array.from(chatEl.querySelectorAll('.msg'));
      for (let i = 1; i < nodes.length; i++) nodes[i].remove();
      scrollToBottom();
    });

    // 页面卸载时关闭连接
    window.addEventListener('beforeunload', () => {
      closeCurrentStream();
    });

    /* ========== Init ========== */
    apiHealth();
    setInterval(apiHealth, 5000);
    loadHistory();
    setTimeout(() => inputEl.focus(), 200);
  </script>
</body>
</html>
